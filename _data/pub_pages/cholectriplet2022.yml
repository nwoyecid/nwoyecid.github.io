acronym: CholecTriplet2022
title: 'CholecTriplet2022: Show Me a Tool and Tell Me the Triplet'
venue: Medical Image Analysis, Volume 89, 102888
year: 2023
authors: C.I. Nwoye, T. Yu, S. Sharma, A. Murali, D. Alapatt, A. Vardazaryan, ..., and N. Padoy
affiliations: ICube, University of Strasbourg, CNRS, France &middot; IHU Strasbourg, France
summary: The second edition of the CholecTriplet challenge at MICCAI 2022, advancing from triplet recognition to detection
  -- requiring models to both localize instruments and predict their associated action triplets.
abstract: Following the success of CholecTriplet2021 on surgical action triplet recognition, we present CholecTriplet2022,
  an endoscopic vision challenge organized at MICCAI 2022 that advances the task to surgical action triplet detection. This
  new task requires models to not only recognize the triplets but also localize the instruments performing the actions. Using
  the CholecT50 dataset with bounding box annotations, the challenge evaluates 11 state-of-the-art methods from participating
  teams, providing insights into the interplay between instrument detection and triplet recognition.
