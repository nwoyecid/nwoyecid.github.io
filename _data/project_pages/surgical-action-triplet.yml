title: "Surgical Action Triplet for Tool-Tissue Interaction Modeling"
status: completed
tagline: "Modeling what happens in surgery as structured instrument-verb-target triplets"

intro: >
  This project introduced the surgical action triplet, a structured
  representation of surgical activities as compositions of the
  instrument being used, the action being performed, and the target
  anatomy being acted upon. This formulation enabled fine-grained
  understanding of tool-tissue interactions in endoscopic video,
  moving beyond simple phase or tool recognition toward a richer
  description of what is actually happening during a procedure.
  The project produced foundational datasets, models, evaluation
  tools, and international benchmarking challenges that have become
  standard references in the field.

sections:
  - heading: "Key Contributions"
    bullets:
      - "<strong>Triplet formulation</strong>: Defined the &lt;instrument, verb, target&gt; triplet as a structured unit of surgical activity, enabling compositional reasoning about tool-tissue interactions."
      - "<strong>CholecT50 dataset</strong>: Created a large-scale dataset of 50 cholecystectomy videos with frame-level triplet annotations covering 100 unique triplet classes (6 instruments, 10 verbs, 15 targets)."
      - "<strong>Deep learning architectures</strong>: Developed Tripnet, Attention-Tripnet, and Rendezvous, a series of progressively more capable models using multi-task learning, attention mechanisms, and transformer-inspired designs."
      - "<strong>Benchmarking challenges</strong>: Organized CholecTriplet2021 and CholecTriplet2022 at MICCAI, evaluating over 30 methods from teams worldwide."
      - "<strong>ivtmetrics library</strong>: Released an open-source Python package for standardized evaluation of triplet recognition and detection methods, available on PyPI and Anaconda."
      - "<strong>Weak and mixed supervision</strong>: Explored training strategies that reduce annotation cost by using partial labels and mixed supervision levels."

