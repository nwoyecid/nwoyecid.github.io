  - heading: "Applications"
    bullets:
      - "<strong>NVIDIA Holoscan SDK</strong>: The ConvLSTM surgical tool tracker is part of the NVIDIA Holoscan endoscopy sample application, enabling real-time tool tracking on NVIDIA edge computing platforms."
      - "<strong>Context-aware assistance</strong>: Tracking outputs feed into higher-level systems for workflow recognition, safety alerts, and decision support during surgery."

