acronym: CaDIS
title: 2020 CATARACTS Semantic Segmentation Challenge
venue: arXiv Preprint
year: 2021
authors: I. Luengo, M. Grammatikopoulou, et al., C.I. Nwoye, D. Alapatt, N. Padoy, et al.
affiliations: Multiple institutions including ICube, University of Strasbourg, CNRS, France
summary: An international challenge for semantic segmentation of surgical instruments and anatomical structures in cataract
  surgery videos, introducing the CaDIS dataset.
abstract: Semantic segmentation of surgical scenes is essential for context-aware assistance in ophthalmic surgery. We present
  the 2020 CATARACTS Semantic Segmentation Challenge, organized to advance automated scene understanding in cataract surgery
  videos. The challenge uses the CaDIS dataset, which provides pixel-level annotations for instruments, anatomy, and other
  structures across three increasingly difficult tasks. Multiple teams submitted deep learning methods, and this paper provides
  a comprehensive analysis of their approaches and results.
links:
  arxiv: https://arxiv.org/abs/2110.10965
