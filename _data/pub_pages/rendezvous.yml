sections:
  - heading: "Demo"
    figures:
      - src: "/assets/img/papers/rendezvous-demo.png"
        caption: "Examples of surgical action triplets detected from cholecystectomy video frames: each triplet captures the instrument, action verb, and target anatomy."

  - heading: "Method"
    figures:
      - src: "/assets/img/papers/rendezvous-architecture.png"
        caption: "The complete Rendezvous (RDV) architecture: a ResNet-18 backbone extracts visual features, CAGAM generates instrument-aware spatial attention, and MHMA models semantic relationships between triplet components."
    text: "The Rendezvous architecture consists of three main components:"
    bullets:
      - "<strong>Encoder backbone</strong>: Extracts visual features from each video frame using a ResNet-18"
      - "<strong>Class Activation Guided Attention (CAGAM)</strong>: Generates instrument-specific spatial attention maps that focus the network on the locations of each detected tool"
      - "<strong>Multi-Head of Mixed Attention (MHMA)</strong>: Models the semantic relationships between instruments, verbs, and targets through combined self-attention and cross-attention heads"
    extra_figures:
      - src: "/assets/img/papers/rendezvous-cagam.png"
        caption: "Detail of the Class Activation Guided Attention Mechanism (CAGAM): class activation maps are refined into instrument-specific spatial attention that guides triplet prediction."

  - heading: "Research Coverage"
    bullets:
      - "<strong>Dataset</strong>: CholecT50 -- 50 cholecystectomy videos with frame-level triplet annotations covering 100 unique triplet classes (6 instruments, 10 verbs, 15 targets)"
      - "<strong>Scope</strong>: The largest study on surgical action triplet recognition at the time of publication"
      - "<strong>Analysis</strong>: Comprehensive ablation study on attention mechanisms, comparison with 7 baseline methods, and per-class performance breakdown"
      - "<strong>Domain</strong>: Minimally invasive surgery (cholecystectomy)"

  - heading: "Results and Findings"
    figures:
      - src: "/assets/img/papers/rendezvous-attention-maps.png"
        caption: "Visualization of learned attention maps: the model focuses on correct instrument locations and their interaction regions with target anatomy."
    text: "Rendezvous achieves state-of-the-art performance on the CholecT50 dataset:"
    bullets:
      - "<strong>26.7% AP</strong> on triplet recognition (vs. 20.3% for the previous best Tripnet)"
      - "CAGAM alone improves triplet AP by +3.4% over the baseline"
      - "MHMA further improves by +2.8% by modeling inter-component relationships"
      - "The model runs in real-time, suitable for intraoperative deployment"
    extra_figures:
      - src: "/assets/img/papers/rendezvous-qualitative-top.png"
        caption: "Qualitative results showing top triplet predictions on challenging surgical scenes with multiple tools and overlapping actions."
