acronym: CoSimGen
title: 'CoSimGen: Controllable Diffusion Model for Simultaneous Image and Mask Generation'
venue: arXiv Preprint
year: 2025
authors: R. Bose, C.I. Nwoye, A. Bhat, N. Padoy
affiliations: ICube, University of Strasbourg, CNRS, France &middot; IHU Strasbourg, France
summary: An extension of SimGen that adds user-controllable conditions for simultaneous generation of surgical images and
  segmentation masks, enabling targeted data augmentation.
abstract: Building on SimGen, we present CoSimGen, a controllable diffusion model for the simultaneous generation of surgical
  images and their segmentation masks. CoSimGen introduces user-specified control signals -- such as class labels, spatial
  layouts, and semantic maps -- that guide the generation process, enabling targeted creation of specific surgical scenarios.
  This controllability is critical for addressing class imbalance and generating rare surgical events that are underrepresented
  in real datasets.
