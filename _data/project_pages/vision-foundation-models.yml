title: "Vision Foundation Models"
status: ongoing
tagline: "Pre-training large-scale models for surgical visual understanding"

intro: >
  This project investigates how foundation models, pre-trained on
  large-scale visual and multimodal data, can be adapted to understand
  surgical scenes. The work covers vision-language alignment, depth-aware
  pre-training, hierarchical representation learning, and reasoning over
  surgical video. The aim is to build general-purpose visual backbones
  that transfer effectively across diverse surgical tasks such as
  instrument detection, phase recognition, and scene captioning.

sections:
  - heading: "Research Directions"
    bullets:
      - "<strong>Vision-language pre-training</strong>: Learning joint representations of surgical images and text descriptions for zero-shot and few-shot transfer to downstream tasks."
      - "<strong>Depth-aware foundation models</strong>: Studying how RGB-D pre-training with depth signals improves representation quality for surgical perception."
      - "<strong>Hierarchical dataset design</strong>: Creating large-scale datasets with multi-level annotations (from scene-level to instrument-level) to enable richer pre-training."
      - "<strong>Surgical reasoning</strong>: Evaluating vision-language models on structured reasoning tasks that require understanding of surgical context, anatomy, and procedure flow."

