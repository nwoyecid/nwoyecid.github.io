acronym: Fingerprint Biometric
title: Enhancing Attendance Management in Firms and Industries Using Fingerprint Biometric Recognition Technique
venue: IOSR Journal of Mobile Computing &amp; Application (IOSR-JMCA)
year: 2016
authors: C.I. Nwoye
affiliations: University of Nigeria, Nsukka
summary: Design and implementation of a fingerprint biometric recognition system for automated attendance tracking in workplaces,
  replacing manual sign-in processes.
abstract: Attendance management in firms and industries has traditionally relied on manual sign-in processes that are time-consuming,
  error-prone, and susceptible to fraudulent practices such as buddy punching. This paper presents the design and implementation
  of a fingerprint biometric recognition system for automated attendance management. The system captures and stores fingerprint
  templates during enrollment, then verifies employee identity through fingerprint matching during clock-in and clock-out
  events. The system was tested in a real-world setting and demonstrated significant improvements in accuracy and efficiency
  over manual methods.
