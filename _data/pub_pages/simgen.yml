acronym: SimGen
title: 'SimGen: A Diffusion-Based Framework for Simultaneous Surgical Image and Segmentation Mask Generation'
venue: arXiv Preprint
year: 2025
authors: A. Bhat, R. Bose, C.I. Nwoye, N. Padoy
affiliations: ICube, University of Strasbourg, CNRS, France &middot; IHU Strasbourg, France
summary: A diffusion-based generative framework that jointly produces paired surgical images and pixel-level segmentation
  masks, addressing the scarcity of annotated surgical data.
abstract: Acquiring large-scale annotated surgical datasets is expensive and time-consuming. We present SimGen, a diffusion-based
  framework for the simultaneous generation of realistic surgical images and their corresponding segmentation masks. By jointly
  modeling the image and mask distributions, SimGen produces perfectly aligned image-mask pairs that can be used to augment
  training data for surgical scene segmentation. The framework is evaluated on multiple surgical segmentation benchmarks,
  demonstrating that augmenting real datasets with SimGen-generated pairs significantly improves segmentation performance.
