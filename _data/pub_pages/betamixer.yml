acronym: BetaMixer
title: Feature Mixing Approach for Detecting Intraoperative Adverse Events in Laparoscopic Roux-en-Y Gastric Bypass Surgery
venue: MICCAI 2025
year: 2025
authors: R. Bose, C.I. Nwoye, J.F. Lazo, J.L. Lavanchy, N. Padoy
affiliations: ICube, University of Strasbourg, CNRS, France &middot; IHU Strasbourg, France
summary: A feature mixing approach using beta-distributed attention for detecting adverse events during bariatric surgery
  from multi-scale temporal video features.
abstract: Detecting adverse events during surgery is critical for patient safety and quality assessment. We present BetaMixer,
  a feature mixing approach for detecting intraoperative adverse events in laparoscopic Roux-en-Y gastric bypass (RYGB) surgery
  videos. The method introduces a beta-distribution-based feature mixing module that combines multi-scale temporal features
  from surgical video to capture both local and global temporal patterns associated with adverse events. Evaluated on a large-scale
  RYGB dataset, BetaMixer achieves state-of-the-art performance in detecting bleeding, tissue damage, and other intraoperative
  complications.
