acronym: Ph.D. Thesis
title: Deep Learning Methods for the Detection and Recognition of Surgical Tools and Activities in Laparoscopic Videos
venue: Universit&eacute; de Strasbourg &middot; Thesis Prize 2022
year: 2021
authors: C.I. Nwoye
affiliations: ICube, University of Strasbourg, CNRS, France &middot; IHU Strasbourg, France
summary: Doctoral thesis introducing the surgical action triplet paradigm for fine-grained surgical activity recognition,
  and developing foundational methods and datasets that have shaped the field.
abstract: 'This thesis addresses the challenge of understanding surgical activities from endoscopic videos. We introduce the
  concept of surgical action triplets -- structured representations of instrument-tissue interactions as <instrument, verb,
  target> -- as a new paradigm for fine-grained surgical activity recognition. We develop three foundational methods: (1)
  a weakly supervised ConvLSTM approach for surgical tool tracking, (2) Tripnet for end-to-end action triplet recognition,
  and (3) Rendezvous, an attention-based model for joint spatial and semantic reasoning over triplet components. We also create
  the CholecT40, CholecT45, and CholecT50 datasets, the first large-scale benchmarks for surgical action triplet recognition.
  This work has led to two international challenges at MICCAI and has been adopted by the community as a standard task in
  surgical AI.'
