- heading: Demo
  figures:
  - src: /assets/img/papers/cholectrack20-annotations.gif
    caption: 'Fine-grained multi-class multi-tool tracking: each instrument is tracked with a unique identity across the video,
      handling occlusions and tool exchanges.'
- heading: Method
  figures:
  - src: /assets/img/papers/cholectrack20-perspectives.gif
    caption: 'SurgiTrack operates across multiple perspectives: tracking tools from intraoperative, intracorporeal, and visibility
      viewpoints.'
  text: 'SurgiTrack addresses the challenges of fine-grained surgical tool tracking through:'
  bullets:
  - '<strong>Multi-cue association</strong>: Combines spatial proximity, visual appearance, and motion patterns for robust
    track assignment'
  - '<strong>Occlusion handling</strong>: Maintains track identities through temporary occlusions using a memory mechanism'
  - '<strong>Tool exchange detection</strong>: Identifies when tools are exchanged between hands and updates track assignments
    accordingly'
- heading: Research Coverage
  bullets:
  - '<strong>Dataset</strong>: CholecTrack20 with multi-class bounding box annotations and track IDs'
  - '<strong>Scope</strong>: First method specifically designed for fine-grained multi-class surgical tool tracking'
  - '<strong>Analysis</strong>: Comprehensive evaluation on all three tracking perspectives (intraoperative, intracorporeal,
    visibility)'
  - '<strong>Domain</strong>: Laparoscopic cholecystectomy, multi-object tracking'
- heading: Results and Findings
  bullets:
  - SurgiTrack outperforms existing MOT methods (DeepSORT, ByteTrack) on surgical tool tracking by significant margins
  - The multi-cue association module improves identity preservation through occlusions by 12%
  - Tool exchange detection reduces ID switches by 35% compared to appearance-only association
  - Real-time capable, processing at 30+ FPS suitable for intraoperative deployment
