  - '<strong>Domain</strong>: Patient safety, surgical quality assessment, bariatric surgery'
- heading: Results and Findings
  bullets:
  - BetaMixer outperforms temporal baseline methods for adverse event detection
  - Beta-distributed mixing captures complementary multi-scale patterns better than uniform or learned mixing
  - The method generalizes across different types of adverse events (bleeding, thermal injury, tissue damage)
