acronym: Surgical Imagen
title: Surgical Text-to-Image Generation
venue: Pattern Recognition Letters, Volume 189, pp. 73-79
year: 2025
authors: C.I. Nwoye, R. Bose, K. Elgohary, L. Arboit, G. Carlino, J.L. Lavanchy, N. Padoy
affiliations: ICube, University of Strasbourg, CNRS, France &middot; IHU Strasbourg, France
summary: A pioneering effort in generating realistic surgical images from triplet-based text prompts using diffusion models,
  enabling data augmentation and educational applications in surgical AI.
abstract: Generating realistic surgical images from textual descriptions has significant potential for data augmentation,
  surgical education, and simulation. We present Surgical Imagen, a text-to-image generation framework tailored for the surgical
  domain. By fine-tuning state-of-the-art diffusion models on surgical datasets with structured triplet-based text annotations
  (instrument, action, target), we generate high-fidelity images of surgical scenes. The generated images are evaluated both
  quantitatively using FID and CLIP metrics and qualitatively through surgeon assessment, demonstrating their realism and
  potential for downstream surgical AI tasks.
