acronym: CholecTrack20
title: 'CholecTrack20: A Dataset for Multi-Class Multi-Tool Tracking in Laparoscopic Surgery'
venue: CVPR 2025
year: 2025
authors: C.I. Nwoye, K. Elgohary, A. Srinivas, F. Zaid, J.L. Lavanchy, N. Padoy
affiliations: ICube, University of Strasbourg, CNRS, France &middot; IHU Strasbourg, France
summary: The first large-scale multi-perspective tracking dataset for surgical tools, providing intraoperative, intracorporeal,
  and visibility-level annotations for 20 cholecystectomy videos.
abstract: 'Tracking surgical tools in laparoscopic videos requires understanding instruments from multiple perspectives: their
  identity, spatial location, and visibility state. We introduce CholecTrack20, a large-scale dataset of 20 laparoscopic cholecystectomy
  videos annotated with multi-class multi-tool tracking labels from three complementary perspectives -- intraoperative (which
  tools are being used by the surgeon), intracorporeal (which tools are inside the body), and visibility (which tools are
  visible in the camera view). The dataset includes 35,000+ frames with bounding box annotations, track IDs, and multi-perspective
  labels. We benchmark several tracking methods and analyze the challenges unique to each perspective.'
