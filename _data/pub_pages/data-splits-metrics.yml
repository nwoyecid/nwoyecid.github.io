  text: 'The work provides two key contributions:'
  bullets:
  - '<strong>Official data splits</strong>: Cross-validation and challenge splits for CholecT50 (50 videos) and CholecT45
    (45 videos), ensuring fair and reproducible comparisons'
  - '<strong>ivtmetrics library</strong>: A Python package computing average precision (AP) metrics at the instrument, verb,
    target, and triplet levels, supporting both recognition and detection tasks'
- heading: Research Coverage
  bullets:
  - '<strong>Datasets</strong>: CholecT50 and CholecT45 with cross-validation folds and held-out test sets'
  - '<strong>Scope</strong>: Benchmark study comparing multiple architectures (Tripnet, Attention-Tripnet, Rendezvous) across
