headline: "Ongoing and completed research initiatives"

items:
  - title: "Activity Recognition for Tool-Tissue Interaction Understanding"
    description: "Creating datasets and deep learning models for surgical action triplet detection <instrument, verb, target> using multi-task learning, weak supervision, and attention/transformer architectures."
    status: ongoing
    links:
      - label: Dataset
        url: "https://paperswithcode.com/dataset/cholect50"
      - label: GitHub
        url: "https://github.com/CAMMA-public/cholect45"
      - label: Challenge 2021
        url: "https://cholectriplet2021.grand-challenge.org/"
      - label: Challenge 2022
        url: "https://cholectriplet2022.grand-challenge.org/"

  - title: "IVTMETRICS: Open Source Triplet Performance Metrics"
    description: "Python package library for unified evaluation of surgical action triplet recognition and detection methods. Available on PyPI and Anaconda."
    status: ongoing
    links:
      - label: Paper
        url: "https://arxiv.org/pdf/2204.05235.pdf"
      - label: GitHub
        url: "https://github.com/CAMMA-public/ivtmetrics"
      - label: PyPI
        url: "https://pypi.org/project/ivtmetrics/"
      - label: Anaconda
        url: "https://anaconda.org/nwoye/ivtmetrics"

  - title: "Surgical Tool Tracking for Context-Aware Assistance"
    description: "Deep learning models for instrument tracking in endoscopic videos using weak supervision for spatial localization and temporal consistency. Integrated in NVIDIA Holoscan SDK."
    status: ongoing
    links:
      - label: Paper
        url: "https://link.springer.com/article/10.1007/s11548-019-01958-6"
      - label: NVIDIA SDK
        url: "https://catalog.ngc.nvidia.com/orgs/nvidia/teams/clara-holoscan/resources/holoscan_endoscopy_sample_data"

  - title: "Surgical Generative AI"
    description: "Pioneering efforts in text-to-image generation for surgery, diffusion-based image and mask synthesis, and generative models for surgical data augmentation."
    status: ongoing
    links:
      - label: SurgicalT2I
        url: "/publications/surgical-text-to-image/"
      - label: SimGen
        url: "https://arxiv.org/abs/2501.09008"
      - label: CoSimGen
        url: "https://arxiv.org/abs/2503.19661"

  - title: "Melanoma Skin Cancer Detection"
    description: "Machine learning methods for early diagnosis of skin cancers, developed during M.Sc. at the University of Southampton, UK."
    status: completed

  - title: "Automatic Diagnosis of Cardiovascular Diseases"
    description: "Automated diagnostic system for cardiovascular disease detection."
    status: completed
