acronym: Courier Service App
title: Enhancing Courier Service with the Development of an Interactive Mobile App in Android Platform
venue: IOSR Journal of Mobile Computing &amp; Application (IOSR-JMCA)
year: 2015
authors: M.N. Agu, C.I. Nwoye, B.O. Ogbuokiri
affiliations: University of Nigeria, Nsukka
summary: An interactive Android mobile application for improving courier service delivery, tracking, and customer communication.
abstract: Courier services face challenges in package tracking, delivery confirmation, and customer communication. This paper
  presents the design and development of an interactive mobile application on the Android platform that enhances courier service
  operations. The application provides real-time package tracking, delivery status notifications, and an interactive interface
  for both courier personnel and customers.
