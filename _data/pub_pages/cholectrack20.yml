  - src: /assets/img/papers/cholectrack20-perspectives.gif
    caption: 'The three complementary tracking perspectives: intraoperative (surgical role), intracorporeal (physical presence),
      and visibility (camera view).'
  text: 'CholecTrack20 introduces three complementary tracking perspectives: Each perspective captures different aspects of
    surgical tool usage, enabling richer understanding of the surgical workflow.'
  bullets:
  - '<strong>Intraoperative perspective</strong>: Tracks tools based on their surgical role (e.g., the tool the surgeon is
    actively operating with)'
  - '<strong>Intracorporeal perspective</strong>: Tracks all tools that are physically inside the patient''s body'
  - '<strong>Visibility perspective</strong>: Tracks tools that are visible in the current camera view'
- heading: Research Coverage
  bullets:
  - '<strong>Dataset</strong>: 20 cholecystectomy videos, 35,000+ annotated frames, multi-class bounding boxes with track
    IDs'
  - '<strong>Scope</strong>: First dataset to provide simultaneous multi-perspective tool tracking annotations'
  - '<strong>Analysis</strong>: Benchmarking of DeepSORT, ByteTrack, and other tracking methods across all three perspectives'
  - '<strong>Domain</strong>: Laparoscopic cholecystectomy, multi-object tracking'
- heading: Results and Findings
  figures:
  - src: /assets/img/papers/cholectrack20-results.gif
    caption: 'Comparison of state-of-the-art tracking methods on CholecTrack20: different methods show varying strengths across
      the three perspectives.'
  bullets:
  - 'Multi-perspective tracking reveals fundamentally different challenges: occlusion handling (intracorporeal), re-identification
    (intraoperative), and appearance changes (visibility)'
  - Existing MOT methods struggle with the unique challenges of surgical tracking, especially tool re-identification after
    removal and re-insertion
  - The dataset enables training specialized trackers for each perspective, opening new research directions
