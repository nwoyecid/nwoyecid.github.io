    caption: 'Multi-perspective tracking architecture for robust surgical tool localization.'
  text: 'The multi-perspective tracking framework consists of:'
  bullets:
  - '<strong>Perspective-specific trackers</strong>: Dedicated tracking heads for each perspective (intraoperative, intracorporeal,
    visibility)'
  - '<strong>Cross-perspective reasoning</strong>: A fusion module that propagates information between perspectives to resolve
    ambiguities'
  - '<strong>Consistency enforcement</strong>: Constraints ensuring logical coherence between perspectives (e.g., a visible
    tool must also be intracorporeal)'
- heading: Research Coverage
  bullets:
  - '<strong>Dataset</strong>: CholecTrack20 benchmark with multi-perspective annotations'
  - '<strong>Scope</strong>: First method to jointly reason across multiple tracking perspectives'
  - '<strong>Analysis</strong>: Per-perspective and joint evaluation, ablation on cross-perspective fusion strategies'
  - '<strong>Domain</strong>: Laparoscopic cholecystectomy, multi-object tracking'
- heading: Results and Findings
  bullets:
  - Joint multi-perspective reasoning improves tracking accuracy over independent single-perspective trackers
  - Cross-perspective fusion is most beneficial during occlusion events and tool exchanges
  - The framework provides a richer understanding of tool usage patterns throughout the surgical procedure
