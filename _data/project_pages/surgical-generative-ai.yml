# ============================================================
# Project Page: Surgical Generative AI
# ============================================================

title: "Surgical Generative AI"
status: ongoing
tagline: "Generating realistic surgical images and annotations for training and augmentation"

intro: >
  This project explores generative modeling for the surgical domain,
  with a focus on creating realistic synthetic surgical images, paired
  segmentation masks, and training data from text descriptions. The
  research addresses the chronic shortage of annotated surgical data
  by developing diffusion-based methods that can produce diverse,
  high-fidelity surgical scenes on demand. These methods have potential
  applications in surgeon training, simulation, and data augmentation
  for downstream perception models.

sections:
  - heading: "Research Directions"
    bullets:
      - "<strong>Text-to-image generation</strong>: Producing realistic surgical images from natural language descriptions of instruments, anatomy, and procedural context."
      - "<strong>Simultaneous image and mask synthesis</strong>: Jointly generating paired surgical images and pixel-level segmentation masks, reducing the need for manual annotation."
      - "<strong>Controllable generation</strong>: Conditioning the generation process on user-specified attributes such as tool type, tissue state, or surgical phase."
      - "<strong>Data augmentation</strong>: Using synthetic data to improve the robustness and generalization of perception models trained on limited real-world surgical datasets."

