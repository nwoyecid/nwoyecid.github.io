<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="{{ '/' | relative_url }}" class="nav-brand">{{ site.title }}</a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a></li>
        <li><a href="{{ '/#publications' | relative_url }}" {% if page.url == '/publications/' %}class="active"{% endif %}>Publications</a></li>
        <li><a href="{{ '/#projects' | relative_url }}">Projects</a></li>
        <li><a href="{{ '/bio/' | relative_url }}" {% if page.url == '/bio/' %}class="active"{% endif %}>Bio</a></li>
        <li><a href="{{ '/contact/' | relative_url }}" {% if page.url == '/contact/' %}class="active"{% endif %}>Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-info">
          <h3>{{ site.title }}</h3>
          <!-- <p>{{ site.affiliation }}</p> -->
           <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
        </div>
        <div class="footer-links">
          <a href="mailto:{{ site.email }}" aria-label="Email">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          </a>
          <a href="{{ site.github }}" target="_blank" aria-label="GitHub">

          </a>
          <a href="{{ site.gscholar }}" target="_blank" aria-label="Google Scholar">

          </a>
          <a href="{{ site.linkedin }}" target="_blank" aria-label="LinkedIn">

          </a>
          <a href="{{ site.twitter }}" target="_blank" aria-label="Twitter">

          </a>
          <a href="{{ site.researchgate }}" target="_blank" aria-label="ResearchGate">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.586 0c-1.326 0-2.198.761-2.726 1.918-.38.837-.524 1.787-.563 2.754H17.6c.396-1.088 1.263-2.054 2.886-2.054 1.08 0 1.904.432 2.396 1.188.492.756.636 1.728.636 2.808v1.368c0 1.08-.144 2.052-.636 2.808-.492.756-1.316 1.188-2.396 1.188-1.584 0-2.46-.936-2.868-2.016h-.036v1.728H16v-11.7h1.584v4.728h.036c.408-1.08 1.284-2.016 2.868-2.016 1.08 0 1.904.432 2.396 1.188.492.756.636 1.728.636 2.808v1.368c0 1.08-.144 2.052-.636 2.808-.492.756-1.316 1.188-2.396 1.188-1.08 0-1.904-.432-2.396-1.188-.492-.756-.636-1.728-.636-2.808zM5.304 10.98c-.504-.216-.936-.504-1.296-.864-.36-.36-.648-.792-.864-1.296-.216-.504-.324-1.08-.324-1.728s.108-1.224.324-1.728c.216-.504.504-.936.864-1.296.36-.36.792-.648 1.296-.864.504-.216 1.08-.324 1.728-.324s1.224.108 1.728.324c.504.216.936.504 1.296.864.36.36.648.792.864 1.296.216.504.324 1.08.324 1.728s-.108 1.224-.324 1.728c-.216.504-.504.936-.864 1.296-.36.36-.792.648-1.296.864-.504.216-1.08.324-1.728.324s-1.224-.108-1.728-.324z"/></svg>
          </a>
        </div>
      </div>
      <!-- <div class="footer-bottom">
        <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
      </div> -->
    </div>
  </footer>

  <script src="{{ '/assets/js/carousel.js' | relative_url }}"></script>
  <script>
    // Mobile nav toggle
    document.getElementById('navToggle').addEventListener('click', function() {
      document.getElementById('navLinks').classList.toggle('active');
      this.classList.toggle('active');
    });
    // Navbar scroll effect
    window.addEventListener('scroll', function() {
      const navbar = document.getElementById('navbar');
      if (window.scrollY > 50) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });
  </script>
</body>
</html>
