  - '<strong>Tools</strong>: ivtmetrics available on [PyPI](https://pypi.org/project/ivtmetrics/) and [Anaconda](https://anaconda.org/nwoye/ivtmetrics)'
  - '<strong>Domain</strong>: Standardization of surgical AI evaluation'
- heading: Results and Findings
  bullets:
  - 'Provides reproducible baselines: Tripnet (20.3% AP), Attention-Tripnet (22.9% AP), Rendezvous (26.7% AP)'
  - ivtmetrics adopted as the official evaluation library for the CholecTriplet challenge series
  - 'Cross-framework consistency: PyTorch and TensorFlow implementations achieve comparable results'
  - The standardized splits have been adopted by the community for fair method comparison
