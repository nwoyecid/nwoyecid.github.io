# Project Page: Surgical Tool Tracking
# ============================================================

title: "Surgical Tool Tracking for Context-Aware Assistance"
status: completed
tagline: "Real-time instrument tracking in endoscopic video for surgical awareness"

intro: >
  This project developed deep learning methods for detecting and tracking
  surgical instruments in endoscopic video, with the goal of providing
  real-time context-aware information to support surgical workflows.
  Starting from weakly supervised approaches that required only binary
  tool presence labels, the work progressed to fine-grained multi-class
  multi-tool tracking across different visual perspectives. The methods
  produced in this project were adopted into the NVIDIA Holoscan SDK
  for intraoperative deployment, and contributed a large-scale
  benchmark dataset for the tracking community.

sections:
  - heading: "Key Contributions"
    bullets:
      - "<strong>Weakly supervised tracking</strong>: Developed a ConvLSTM-based approach that localizes and tracks surgical tools using only binary presence labels, eliminating the need for expensive bounding box annotations."
      - "<strong>Multi-perspective tracking</strong>: Introduced methods that integrate complementary tracking perspectives (detection-based, point-based, and segmentation-based) for more robust localization under occlusion and tool exchange."
      - "<strong>Fine-grained multi-class tracking</strong>: Built SurgiTrack, a system capable of distinguishing and tracking multiple tool types simultaneously across video frames."
      - "<strong>CholecTrack20 dataset</strong>: Created a large-scale multi-perspective tracking dataset with multi-class multi-tool annotations for laparoscopic cholecystectomy."
      - "<strong>Industrial adoption</strong>: The ConvLSTM tracker was integrated into the NVIDIA Holoscan SDK for real-time surgical tool tracking on edge devices."

  - heading: "Associated Papers"
    papers:
