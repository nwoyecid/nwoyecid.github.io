acronym: ConvLSTM Tracker
title: Weakly Supervised Convolutional LSTM Approach for Tool Tracking in Laparoscopic Videos
venue: IPCAI 2019 &middot; Oral &middot; Audience Choice Best Paper Award
year: 2019
authors: C.I. Nwoye, D. Mutter, J. Marescaux, N. Padoy
affiliations: ICube, University of Strasbourg, CNRS, France &middot; IHU Strasbourg, France
summary: A weakly supervised deep learning method for surgical tool tracking using only binary tool presence labels, leveraging
  ConvLSTM for temporal modeling. Now integrated in the NVIDIA Holoscan SDK for real-time surgical AI.
abstract: Surgical tool tracking is an essential but challenging task in computer-assisted interventions. We propose a weakly
  supervised approach for tool tracking in laparoscopic videos that relies only on binary tool presence labels for training.
  Our method leverages convolutional LSTM to model the temporal evolution of class activation maps (CAMs), enabling the network
  to learn smooth spatial tool localizations over time without requiring any bounding box or pixel-level annotations during
  training. The approach generates tool presence detection, spatial localization, and motion tracking in a unified framework.
