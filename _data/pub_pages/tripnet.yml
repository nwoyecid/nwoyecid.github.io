acronym: TRIPNET
title: Recognition of Instrument-Tissue Interactions in Endoscopic Videos via Action Triplets
venue: MICCAI 2020 &middot; Oral Presentation
year: 2020
authors: C.I. Nwoye, C. Gonzalez, T. Yu, P. Mascagni, D. Mutter, J. Marescaux, and N. Padoy
affiliations: ICube, University of Strasbourg, CNRS, France &middot; IHU Strasbourg, France
summary: The first work to formalize surgical activity recognition as action triplets &lt;instrument, verb, target&gt;, introducing
  both the CholecT40 dataset and the Tripnet architecture for end-to-end triplet recognition from video.
abstract: Surgical activity recognition is of growing importance for monitoring and understanding surgical procedures. Current
  state of the art focuses on recognizing short-term activities and long-term phases from surgical videos. In this paper,
  we propose to model fine-grained activities as action triplets of instrument, verb, and target. We introduce a new dataset,
  CholecT40, consisting of 40 laparoscopic cholecystectomy videos annotated with action triplet labels. We also introduce
  Tripnet, a 3-stage architecture that models the triplet components and their associations using a novel attention-based
  module called the Triplet Interaction Module (TRI). It first detects the instruments, then uses the detected instruments
  to predict the verbs and targets, and finally associates them into triplets.
