acronym: SMS Slang Converter
title: Motivation for the Design and Implementation of a SMS Slang Converter for Android Devices
venue: International Journal of Interactive Mobile Technologies (iJIM)
year: 2016
authors: C.N. Udanor, C.I. Nwoye
affiliations: University of Nigeria, Nsukka
summary: An Android application that converts SMS slang abbreviations to standard English text, improving readability and
  communication clarity.
abstract: Short Message Service (SMS) communication has led to the widespread use of slang abbreviations that can hinder clear
  communication, particularly across generational and cultural boundaries. This paper presents the design and implementation
  of an SMS slang converter for Android devices that automatically translates common SMS abbreviations into standard English
  text. The application uses a dictionary-based approach with pattern matching to identify and replace slang terms in real-time.
