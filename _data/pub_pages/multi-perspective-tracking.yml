acronym: MPT
title: Multi-Perspective Tracking of Surgical Tools
venue: IPCAI 2025
year: 2025
authors: C.I. Nwoye, N. Padoy
affiliations: ICube, University of Strasbourg, CNRS, France &middot; IHU Strasbourg, France
summary: A unified framework that integrates intraoperative, intracorporeal, and visibility tracking perspectives for more
  robust and accurate surgical tool tracking under challenging real-world conditions.
abstract: 'Surgical tool tracking from endoscopic video remains challenging due to occlusions, visual similarity between tools,
  and rapid camera movements. We propose a multi-perspective tracking framework that jointly reasons about tool tracking from
  three complementary viewpoints: intraoperative (surgical role), intracorporeal (physical presence), and visibility (camera
  view). By modeling the dependencies between these perspectives, the framework achieves more robust tracking than single-perspective
  methods, especially in difficult scenarios such as tool exchanges and partial occlusions.'
