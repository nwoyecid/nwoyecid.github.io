  figures:
  - src: /assets/img/papers/convlstm-results.png
    caption: 'Comparison of spatial localization: ConvLSTM produces smoother, more accurate tool tracking than static CAM
      approaches.'
  bullets:
  - Achieves tracking performance competitive with fully supervised methods while requiring only binary presence labels
  - ConvLSTM improves localization accuracy by 7.8% over static CAM approaches
  - Won the <strong>IPCAI 2019 Audience Choice Award for Best Paper Presentation</strong>
  - Adopted by NVIDIA as a reference model in the Holoscan SDK for surgical tool tracking
