acronym: CholecTriplet2021
title: 'CholecTriplet2021: A Benchmark Challenge for Surgical Action Triplet Recognition'
venue: Medical Image Analysis, Volume 86, 102803
year: 2023
authors: C.I. Nwoye, D. Alapatt, T. Yu, A. Vardazaryan, F. Xia, Z. Zhao, ..., and N. Padoy
affiliations: ICube, University of Strasbourg, CNRS, France &middot; IHU Strasbourg, France
summary: An international endoscopic vision challenge at MICCAI 2021, evaluating 20 deep learning methods from 14 teams on
  the task of surgical action triplet recognition using the CholecT45 dataset.
abstract: Surgical action triplet recognition from endoscopic videos is a fundamental task for context-aware assistance in
  the operating room. This paper presents CholecTriplet2021, an endoscopic vision challenge organized at MICCAI 2021 for the
  recognition of surgical action triplets in laparoscopic cholecystectomy videos. Using the CholecT45 dataset, the challenge
  attracted 14 participating teams who developed 20 deep learning methods. This paper provides comprehensive analysis of the
  methods, including a novel ensemble approach, and discusses the remaining open challenges.
