- heading: "What is Surgical Imagen?"
  text: >
    <strong>Surgical Imagen</strong> is a specialized generative model developed to address significant challenges
    in acquiring high-quality, annotated surgical data for research, training, and development in the medical field,
    particularly in the domain of laparoscopic surgery. Surgical Imagen is a diffusion-based text-to-image generative
    model designed to create photorealistic surgical images from textual descriptions, specifically using triplet-based
    textual prompts that include an instrument, an action, and a target (e.g., "clipper clip cystic duct"). This model
    builds upon the foundational principles of the Imagen framework, which integrates a large language model, a diffusion
    model, and a super-resolution component to generate high-fidelity images from text inputs.
  bullets:
  - '<strong>Text-to-Image Generation</strong>: Surgical Imagen generates realistic surgical images based on text descriptions, capturing the nuances and details required for surgical training and education.'
  - '<strong>Triplet-Based Prompts</strong>: The model leverages triplet annotations (instrument, action, target) to succinctly describe surgical scenes. This format ensures that the generated images are contextually accurate and semantically meaningful.'
  - '<strong>Diffusion Model</strong>: By employing a diffusion-based generative approach, Surgical Imagen produces high-quality images that closely resemble real surgical scenarios.'
  - '<strong>Instrument-Based Class Balancing</strong>: To address the imbalance in surgical datasets, where some critical actions or instruments may be underrepresented, Surgical Imagen includes a technique to balance the classes based on instrument frequency in the dataset. This improves training convergence and the ability to generate diverse and representative images.'
  - '<strong>Evaluation and Validation</strong>: The model''s effectiveness is validated using human expert evaluations and automated metrics such as FID (Fr&eacute;chet Inception Distance) and CLIP (Contrastive Language-Image Pre-Training) scores. These evaluations ensure that generated images are not only photorealistic but also align well with the input textual prompts. It also covers aspects such as quality, reasoning, knowledge and robustness.'

- heading: Method
  figures:
  - src: /assets/img/papers/t2i-architecture.png
    caption: 'The Surgical Imagen pipeline: triplet-based text prompts (e.g. "clipper clip cystic duct") are encoded by a
      large language model and used to condition a cascaded diffusion model for generating photorealistic surgical images.'
  text: 'The Surgical Imagen framework builds on the Imagen architecture with surgical-specific adaptations:'
  bullets:
  - '<strong>Triplet-based text conditioning</strong>: Structured prompts describing surgical scenes as &lt;instrument, verb, target&gt; triplets (e.g., "grasper retract gallbladder")'
  - '<strong>Cascaded diffusion model</strong>: A base diffusion model generates low-resolution images, followed by super-resolution stages for high-fidelity output'
  - '<strong>Instrument-based class balancing</strong>: Addresses dataset imbalance by balancing training samples based on instrument frequency'

