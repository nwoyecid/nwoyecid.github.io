  text: 'The challenge evaluated diverse deep learning approaches:'
  bullets:
  - Multi-task learning architectures with shared backbones
  - Attention-based models for component association
  - Graph neural networks for triplet relationship modeling
  - Transformer-based methods for temporal reasoning
  - A novel ensemble method combining top submissions
- heading: Research Coverage
  bullets:
  - '<strong>Dataset</strong>: CholecT45 -- 45 cholecystectomy videos with triplet annotations, standardized splits'
  - '<strong>Scope</strong>: 14 international teams, 20 submitted methods'
  - '<strong>Analysis</strong>: Per-class evaluation, failure case analysis, statistical significance testing, and method
    categorization'
  - '<strong>Domain</strong>: Endoscopic vision, surgical activity recognition'
- heading: Results and Findings
  figures:
  - src: /assets/img/papers/ct2021-tripnet.png
    caption: The Tripnet baseline architecture used as reference for all challenge submissions.
  bullets:
  - Best single method achieved <strong>32.7% triplet AP</strong>, showing significant progress over initial baselines
  - Ensemble of top methods reached <strong>36.9% triplet AP</strong>
  - Attention mechanisms and multi-task learning were the most effective design patterns
  - Significant performance gap between frequent and rare triplet classes remains an open challenge
