sections:
- heading: Demo
  figures:
  - src: /assets/img/papers/tripnet-task.png
    caption: 'The surgical action triplet task: recognizing fine-grained instrument-tissue interactions as &lt;instrument,
      verb, target&gt; triplets from endoscopic video.'
- heading: Method
  figures:
  - src: /assets/img/papers/tripnet-architecture.png
    caption: 'The Tripnet architecture: a 3-stage model that detects instruments, predicts verbs and targets, and associates
      them into complete action triplets via the Triplet Interaction Module (TRI).'
  text: 'Tripnet is a 3-stage deep learning architecture:'
  bullets:
  - '<strong>Stage 1 -- Instrument Detection</strong>: A weakly-supervised CNN detects which instruments are present in the
    frame'
  - '<strong>Stage 2 -- Verb and Target Recognition</strong>: Instrument features are used to predict the associated actions
    and anatomical targets'
  - '<strong>Stage 3 -- Triplet Interaction Module (TRI)</strong>: An attention module that associates the three components
    into complete triplets by modeling their dependencies'
- heading: Research Coverage
  bullets:
  - '<strong>Dataset</strong>: CholecT40 -- 40 cholecystectomy videos with 127,385 frames annotated with 100 triplet classes
    (6 instruments, 10 verbs, 15 targets)'
  - '<strong>Scope</strong>: First large-scale study of fine-grained surgical activity as action triplets'
  - '<strong>Analysis</strong>: Comparison with multi-task learning baselines and ablation on triplet association strategies'
  - '<strong>Domain</strong>: Laparoscopic cholecystectomy'
- heading: Results and Findings
  figures:
  - src: /assets/img/papers/tripnet-results.png
    caption: Qualitative results on challenging surgical scenes showing triplet predictions and their confidence scores.
  bullets:
  - <strong>20.3% triplet AP</strong> -- establishing the first benchmark for this new task
  - The Triplet Interaction Module (TRI) improves triplet association by +4.1% over naive combination
  - Demonstrates that modeling triplets captures richer surgical context than recognizing phases or tools alone
  - The triplet paradigm has since become a standard task in surgical AI, adopted by multiple international challenges
