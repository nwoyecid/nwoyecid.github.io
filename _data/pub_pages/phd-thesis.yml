  text: 'The thesis develops three key methods:'
  bullets:
  - '<strong>ConvLSTM Tracker</strong> (IPCAI 2019): Weakly supervised surgical tool tracking using only binary presence labels
    with temporal ConvLSTM modeling'
  - '<strong>Tripnet</strong> (MICCAI 2020): The first architecture for end-to-end surgical action triplet recognition with
    the Triplet Interaction Module'
  - '<strong>Rendezvous</strong> (Medical Image Analysis 2022): Attention-based model combining class activation guided attention
    (CAGAM) and multi-head mixed attention (MHMA) for state-of-the-art triplet recognition'
- heading: Research Coverage
  bullets:
  - '<strong>Datasets created</strong>: CholecT40 (40 videos), CholecT45 (45 videos), CholecT50 (50 videos) -- collectively
    the standard benchmarks for surgical action triplet research'
  - '<strong>Scope</strong>: From tool detection to fine-grained activity understanding, spanning weak supervision, attention
    mechanisms, and multi-task learning'
  - '<strong>Impact</strong>: Established the surgical action triplet task, adopted by MICCAI challenges (CholecTriplet2021,
    CholecTriplet2022) and numerous follow-up works'
  - '<strong>Domain</strong>: Minimally invasive surgery, computer-assisted interventions'
- heading: Results and Findings
  figures:
  - src: /assets/img/papers/rendezvous-attention-maps.png
    caption: Learned attention maps from Rendezvous showing the model's ability to focus on relevant instrument-anatomy interaction
      regions.
  bullets:
  - The surgical action triplet paradigm provides richer surgical understanding than phase recognition or tool detection alone
  - 'Progressive improvement: ConvLSTM Tracker (tool tracking) -> Tripnet (20.3% triplet AP) -> Rendezvous (26.7% triplet
    AP)'
  - Datasets and methods have been widely adopted, with 500+ citations across the thesis publications
  - Awarded the <strong>2022 Thesis Prize</strong> from Universit&eacute; de Strasbourg
