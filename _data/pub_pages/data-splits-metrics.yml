acronym: ivtmetrics
title: Data Splits and Metrics for Benchmarking Methods on Surgical Action Triplet Datasets
venue: arXiv Preprint
year: 2022
authors: C.I. Nwoye, N. Padoy
affiliations: ICube, University of Strasbourg, CNRS, France &middot; IHU Strasbourg, France
summary: Standard data splits for the CholecT50 and CholecT45 datasets, along with the open-source ivtmetrics library for
  unified evaluation of surgical action triplet methods.
abstract: Benchmarking deep learning methods requires standardized data splits and evaluation metrics. In this work, we formalize
  the official data splits for the CholecT50 and CholecT45 datasets for surgical action triplet recognition and detection.
  We also introduce ivtmetrics, an open-source Python library that provides unified evaluation metrics including average precision
  (AP) for instrument, verb, target, and triplet recognition and detection. The library supports both PyTorch and TensorFlow
  workflows and is available on PyPI and Anaconda.
