# ----- Hero / Front Matter -----
acronym: "RENDEZVOUS"
title: "Rendezvous: Attention Mechanisms for the Recognition of Surgical Action Triplets in Endoscopic Videos"
venue: "Medical Image Analysis, Volume 78, 102433"
year: 2022
authors: >
  Chinedu Nwoye<sup>1,2</sup>, Tong Yu<sup>1,2</sup>, Cristians Gonzalez<sup>2</sup>,
  Barbara Seeliger<sup>2</sup>, Pietro Mascagni<sup>1,2</sup>, Didier Mutter<sup>2</sup>,
  Jacques Marescaux<sup>2</sup>, Nicolas Padoy<sup>1,2</sup>
affiliations: >
  <sup>1</sup>ICube, University of Strasbourg, CNRS, France
  <span style="margin-left:12px"><sup>2</sup>IHU Strasbourg, France</span>
summary: "A transformer-inspired deep learning model that uses class activation guided attention (CAGAM) and multi-head of mixed attention (MHMA) to jointly detect surgical instruments, recognize actions, and identify targets as action triplets from endoscopic video."

abstract: >
  Out of the description of surgical procedures as a series of triplets of
  the used instruments, performed actions, and treated anatomies, the
  recognition of these triplets in surgical videos is becoming a new
  challenge. Extending the CholecT40 and CholecT45 datasets with 5
  additional videos and bounding box instrument annotations, we introduce
  CholecT50 -- a large-scale dataset for the recognition of surgical action
  triplets. We propose Rendezvous (RDV) -- a deep learning model that
  recognizes surgical action triplets directly from videos by leveraging
  attention at two complementary levels: (1) a class activation guided
  attention mechanism (CAGAM) that generates instrument-aware spatial maps
  to focus on the relevant tools in the scene and (2) a multi-head of mixed
  attention (MHMA) that captures relationships between instruments, verbs,
  and targets by combining self- and cross-attention to model inter- and
  intra-triplet component associations.

links:
  publication: "https://doi.org/10.1016/j.media.2022.102433"
  arxiv: "https://arxiv.org/abs/2109.03223"
