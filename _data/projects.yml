headline: "Ongoing and completed research initiatives"

items:
  - title: "Intuitive Surgical Projects [Undisclosed]"
    description: "AI research and development supporting features on the Intuitive da Vinci robotic-assisted surgical platform. Project details are undisclosed."
    status: ongoing
    project_page: intuitive-surgical-projects

  - title: "Vision Foundation Models"
    description: "Pre-training large-scale vision and multimodal models for surgical scene understanding, covering vision-language alignment, depth-aware representations, and structured reasoning over surgical video."
    status: ongoing
    project_page: vision-foundation-models

  - title: "Surgical Generative AI"
    description: "Developing diffusion-based methods for generating realistic surgical images, paired segmentation masks, and training data from text descriptions to address the shortage of annotated surgical data."
    status: ongoing
    project_page: surgical-generative-ai

  - title: "Surgical Action Triplet for Tool-Tissue Interaction Modeling"
    description: "Introduced the surgical action triplet representation for modeling what happens during surgery as structured instrument-verb-target compositions. Produced foundational datasets, models, evaluation tools, and international challenges."
    status: completed
    project_page: surgical-action-triplet

  - title: "Surgical Tool Tracking for Context-Aware Assistance"
    description: "Deep learning methods for real-time instrument tracking in endoscopic video, from weakly supervised spatial localization to fine-grained multi-class multi-tool tracking. Adopted into the NVIDIA Holoscan SDK."
    status: completed
    project_page: surgical-tool-tracking

  - title: "Computer Assisted Diagnostic"
    description: "Machine learning systems for automated diagnosis from medical images and clinical data, covering melanoma detection, cataract surgery segmentation, and cardiovascular disease prediction."
    status: completed
    project_page: computer-assisted-diagnostic
