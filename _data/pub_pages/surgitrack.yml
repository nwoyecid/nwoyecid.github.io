acronym: SurgiTrack
title: 'SurgiTrack: Fine-Grained Multi-Class Multi-Tool Tracking in Surgical Videos'
venue: Medical Image Analysis, Volume 90, 103438
year: 2025
authors: C.I. Nwoye, N. Padoy
affiliations: ICube, University of Strasbourg, CNRS, France &middot; IHU Strasbourg, France
summary: A novel tracking method that simultaneously tracks multiple surgical tools of different classes, handling challenges
  like occlusion, tool exchanges, and re-identification across video sequences.
abstract: 'Tracking surgical tools in endoscopic videos is a critical task for surgical workflow analysis. Existing methods
  either track a single tool class or fail when multiple tools of the same appearance interact. We present SurgiTrack, a fine-grained
  multi-class multi-tool tracking approach that addresses three key challenges: (1) distinguishing between multiple instances
  of the same tool class, (2) maintaining identity through occlusions and temporary disappearances, and (3) handling tool
  exchanges between the surgeon''s hands. SurgiTrack combines a detection backbone with a novel association module that leverages
  spatial, appearance, and motion cues for robust tracking.'
